 "hanja": "臨機應變", "meaning": "그때그때의 상황에 맞추어 즉시 대처함", "chapter": 6, "kind": "idiom", "tip": "상황에 맞닥뜨려 변화에 대응한다"}, {"word": "동분서주", "hanja": "東奔西走", "meaning": "여러 일을 처리하기 위해 이리저리 바쁘게 돌아다님", "chapter": 6, "kind": "idiom", "tip": "동쪽으로 뛰고 서쪽으로 달린다"}, {"word": "신출귀몰", "hanja": "神出鬼沒", "meaning": "나타나고 사라지는 움직임을 예측하기 어려움", "chapter": 6, "kind": "idiom", "tip": "신처럼 나타나고 귀신처럼 사라진다"}, {"word": "일각천금", "hanja": "一刻千金", "meaning": "아주 짧은 시간도 천금처럼 귀중함", "chapter": 6, "kind": "idiom", "tip": "짧은 한순간이 천금의 가치다"}, {"word": "일진일퇴", "hanja": "一進一退", "meaning": "나아갔다가 물러나는 일을 반복함", "chapter": 6, "kind": "idiom", "tip": "한 번 전진하고 한 번 후퇴한다"}, {"word": "전광석화", "hanja": "電光石火", "meaning": "행동이나 움직임이 매우 빠름", "chapter": 6, "kind": "idiom", "tip": "번개와 부싯돌 불꽃처럼 빠르다"}, {"word": "좌충우돌", "hanja": "左衝右突", "meaning": "이리저리 마구 부딪치며 행동함", "chapter": 6, "kind": "idiom", "tip": "왼쪽 오른쪽으로 마구 부딪친다"}, {"word": "종횡무진", "hanja": "縱橫無盡", "meaning": "거침없이 자유자재로 행동하거나 활약함", "chapter": 6, "kind": "idiom", "tip": "가로세로 막힘없이 누빈다"}, {"word": "응집", "syn": "결집", "ant": ["분산", "이산"], "chapter": 6, "kind": "vocab", "defs": {"응집": "한곳에 모여 뭉침", "결집": "흩어진 것을 한데 모음", "분산": "여러 곳으로 흩어짐", "이산": "떨어져 흩어짐"}}, {"word": "발산", "syn": "방출", "ant": ["응축", "흡수"], "chapter": 6, "kind": "vocab", "defs": {"발산": "밖으로 퍼져 나감", "방출": "밖으로 내보냄", "응축": "모여 농축됨", "흡수": "안으로 빨아들임"}}, {"word": "상승", "syn": "급등", "ant": ["하강", "급락"], "chapter": 6, "kind": "vocab", "defs": {"상승": "위로 올라감", "급등": "갑자기 크게 올라감", "하강": "아래로 내려감", "급락": "갑자기 크게 떨어짐"}}, {"word": "수축", "syn": "축소", "ant": ["이완", "팽창"], "chapter": 6, "kind": "vocab", "defs": {"수축": "오그라들어 줄어듦", "축소": "크기나 범위를 줄임", "이완": "긴장이 풀려 느슨해짐", "팽창": "부피나 규모가 커짐"}}, {"word": "신속", "syn": "민첩", "ant": ["지연", "지체"], "chapter": 6, "kind": "vocab", "defs": {"신속": "매우 빠름", "민첩": "재빠르고 날쌤", "지연": "늦어지거나 늦춤", "지체": "늦어져 진행이 더딤"}}]};const $=id=>document.getElementById(id);let tab='home',session=[],index=0,answered=false,flip=false,mode='quiz';const KEY='mo-vocab-master-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}saved.wrong??={};saved.seen??={};saved.total??=0;saved.correct??=0;saved.daily??={};function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}}const idOf=(item)=>item.chapter+'-'+item.kind+'-'+item.word;const random=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};const pool=()=>DATA.items.filter(x=>($('chapter').value==='0'||x.chapter===Number($('chapter').value))&&($('category').value==='all'||x.kind===$('category').value));const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('sv-SE');DATA.chapters.forEach((c,i)=>$('chapter').insertAdjacentHTML('beforeend',`<option value="${i+1}">${i+1}. ${c}</option>`));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));$('chapter').onchange=$('category').onchange=()=>{if(tab==='quiz'||tab==='cards'||tab==='wrong')start(tab);else render()};function switchTab(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));if(t==='home')render();else start(t)}function start(t){mode=t;let p=pool();if(t==='wrong')p=p.filter(x=>saved.wrong[idOf(x)]);session=random(p.flatMap(x=>x.kind==='idiom'?[{item:x,type:'idiom'}]:[{item:x,type:'syn'},{item:x,type:'ant'}]));index=0;answered=false;flip=false;render()}
function explain(x){return x.kind==='idiom'?`<div><b>${escape(x.word)} (${escape(x.hanja)})</b> — ${escape(x.meaning)}</div><div>💡 연상 암기: ${escape(x.tip)}</div>`:`<div><b>${escape(x.word)}</b> — ${escape(x.defs[x.word])}</div><div>유의어: ${escape(x.syn)} — ${escape(x.defs[x.syn])}</div>${x.ant.map(w=>`<div>반의어: ${escape(w)} — ${escape(x.defs[w])}</div>`).join('')}`}
function choiceMeaning(w,x){if(x.defs?.[w])return x.defs[w];for(const z of DATA.items){if(z.kind==='idiom'&&z.word===w)return z.meaning;if(z.defs?.[w])return z.defs[w]}return ''}
function render(){const el=$('content');if(tab==='home'){let seen=Object.keys(saved.seen).length,wrong=Object.keys(saved.wrong).length,day=saved.daily[today()]||{total:0,correct:0};el.innerHTML=`<section class="panel"><h2>오늘의 학습</h2><div class="stats"><div class="stat"><b>${day.total}</b><span class="muted">오늘 푼 문제</span></div><div class="stat"><b>${day.total?Math.round(day.correct/day.total*100):0}%</b><span class="muted">오늘 정답률</span></div><div class="stat"><b>${wrong}</b><span class="muted">오답 항목</span></div></div><h3>전체 암기 현황</h3><div class="progress"><div style="width:${Math.min(100,seen/114*100)}%"></div></div><p>${seen} / 114개 기본 항목 학습 · 누적 ${saved.total}문제 풀이</p><p class="muted">사자성어 84개 + 유·반의어 기준어 30개. 퀴즈는 유의어와 반의어를 따로 출제해 총 144문제입니다.</p><div class="controls"><button class="primary" onclick="switchTab('quiz')">랜덤 퀴즈 시작</button><button onclick="switchTab('cards')">암기 카드 보기</button><button onclick="switchTab('wrong')">틀린 문제 복습</button></div></section>`;return}if(!session.length){el.innerHTML=`<section class="panel"><h2>${tab==='wrong'?'현재 복습할 오답이 없어요!':'선택한 범위에 항목이 없어요.'}</h2><button onclick="switchTab('home')">홈으로</button></section>`;return}if(index>=session.length){el.innerHTML=`<section class="panel"><h2>🎉 한 바퀴 완료!</h2><p>${session.length}개 문제를 모두 확인했어요.</p><div class="controls"><button class="primary" onclick="start('${tab}')">다시 랜덤으로</button><button onclick="switchTab('home')">학습 현황</button></div></section>`;return}let q=session[index],x=q.item;let tag=`${DATA.chapters[x.chapter-1]} · ${q.type==='idiom'?'사자성어':q.type==='syn'?'유의어':'반의어'}`;let top=`<section class="panel"><div class="controls"><span class="pill">${tag}</span><span class="muted">${index+1} / ${session.length}</span></div><div class="progress"><div style="width:${index/session.length*100}%"></div></div>`;if(tab==='cards'){let front=x.word,back=x.kind==='idiom'?x.meaning:`유의어: ${x.syn} / 반의어: ${x.ant.join(', ')}`;el.innerHTML=top+`<div class="flash" onclick="flip=!flip;render()"><span class="small">카드를 눌러 뒤집기</span><strong>${escape(flip?back:front)}</strong>${!flip&&x.kind==='idiom'?`<span class="muted">${escape(x.hanja)}</span>`:''}</div>${flip?`<div class="feedback">${explain(x)}</div>`:''}<div class="controls footer"><button onclick="next()">다음 카드 →</button><button onclick="markWrong()">⭐ 다시 외울 항목</button></div></section>`;return}let prompt=q.type==='idiom'?`다음 뜻에 해당하는 사자성어는?<div class="question">${escape(x.meaning)}</div>`:q.type==='syn'?`<strong>${escape(x.word)}</strong>의 유의어는?`:`<strong>${escape(x.word)}</strong>의 반의어는?`;let answer=q.type==='idiom'?x.word:q.type==='syn'?x.syn:x.ant[0];if(!q.choices){let candidates=q.type==='idiom'?DATA.items.filter(z=>z.kind==='idiom'&&z.word!==x.word).map(z=>z.word):DATA.items.filter(z=>z.kind==='vocab'&&z.word!==x.word).flatMap(z=>q.type==='syn'?[z.syn]:z.ant);q.choices=random([answer,...random([...new Set(candidates)].filter(v=>v!==answer&&(q.type!=='ant'||!x.ant.includes(v)))).slice(0,3)])}el.innerHTML=top+`<div class="muted">${q.type==='idiom'?'뜻 → 사자성어':'어휘 관계 맞히기'}</div><div class="question">${prompt}</div><div class="answers">${q.choices.map((v,i)=>`<button id="opt${i}" onclick="choose(${i})">${'ABCD'[i]}. ${escape(v)}</button>`).join('')}</div><div id="response"></div></section>`;if(answered&&q.selected!==undefined)showAnswer(q)}function showAnswer(q){let x=q.item,ans=q.type==='idiom'?x.word:q.type==='syn'?x.syn:x.ant[0];q.choices.forEach((v,i)=>{$('opt'+i).disabled=true;if(v===ans)$('opt'+i).classList.add('correct');else if(i===q.selected)$('opt'+i).classList.add('wrong')});$('response').innerHTML=`<div class="feedback"><b>${q.choices[q.selected]===ans?'✅ 정답!':'❌ 아쉬워요!'}</b><div>정답: <b>${escape(ans)}</b></div><div>${explain(x)}<hr><b>선택지 뜻</b>${q.choices.map(w=>`<div>${escape(w)} — ${escape(choiceMeaning(w,x))}</div>`).join('')}</div></div><div class="controls footer"><button class="primary" onclick="next()">${index+1===session.length?'학습 완료':'다음 문제 →'}</button></div>`}function choose(i){if(answered)return;answered=true;let q=session[index],x=q.item,ans=q.type==='idiom'?x.word:q.type==='syn'?x.syn:x.ant[0];q.selected=i;let ok=q.choices[i]===ans;let key=idOf(x);saved.seen[key]=true;saved.total++;if(ok){saved.correct++;delete saved.wrong[key]}else saved.wrong[key]=true;let day=saved.daily[today()]??={total:0,correct:0};day.total++;if(ok)day.correct++;persist();showAnswer(q)}function markWrong(){saved.wrong[idOf(session[index].item)]=true;persist();next()}function next(){index++;answered=false;flip=false;render()}
</script></body></html>
